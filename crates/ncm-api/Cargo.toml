[package]
name = "ncm-api"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
lofty = "0.25.4"
md-5 = "0.11.0"
percent-encoding = "2.3.2"
rand = "0.10.3"
reqwest = {
  version = "0.13.4",
  default-features = false,
  features = [
    "charset",
    "gzip",
    "json",
    "rustls-no-provider",
    "stream",
  ]
}
rsa = { version = "0.9.10", features = ["pem"] }
tokio = { version = "1.53.1", features = ["fs"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

log = "0.4.34"
thiserror = "2.0.21"

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }
rustls = { version = "0.23.32", features = ["ring"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
