[package]
name = "ncm-api"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aes = "0.9.2"
base64 = "0.23.0"
lofty = "0.24.0"
md-5 = "0.11.0"
percent-encoding = "2.3.2"
rand = "0.10.2"
reqwest = {
  version = "0.13.4",
  default-features = false,
  features = [
    "charset",
    "gzip",
    "json",
    "rustls-no-provider",
    "stream",
  ]
}
rsa = { version = "0.9.10", features = ["pem"] }
tokio = { version = "1.53.1", features = ["fs"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

dirs = "6.0.0"
log = "0.4.33"
thiserror = "2.0.18"

[dev-dependencies]
qrcode = "0.14.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
