[package]
name = "ncm-api"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aes = { workspace = true }
base64 = { workspace = true, features = ["std"] }
# `id3v2_compression_support` is lofty's only default feature; keep it explicit
# so uploaded files with compressed ID3v2 tags still parse.
lofty = { workspace = true, features = ["id3v2_compression_support"] }
md-5 = { workspace = true }
percent-encoding = { workspace = true, features = ["std"] }
rand = { workspace = true, features = ["std", "thread_rng"] }
reqwest = { workspace = true, features = ["charset", "gzip", "json", "rustls-no-provider", "stream"] }
rsa = { workspace = true, features = ["pem", "std"] }
tokio = { workspace = true, features = ["fs", "rt"] }

serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

log = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
qrcode = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
