[package]
name = "sonar"
version = "0.1.0"
edition = "2024"
description = "A library for searching audios from youtube,bilibili and other platforms.(no cookies)"
license = "MIT"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true, features = ["std"] }
log = { workspace = true, features = ["std"] }
md-5 = { workspace = true }
once_cell = { workspace = true, features = ["std"] }
# `\blive\b` is a Unicode word boundary; without `unicode` it would match in
# the middle of a Chinese title. `perf` keeps the original engine tuning.
regex = { workspace = true, features = ["std", "perf", "unicode"] }
reqwest = { workspace = true, features = ["gzip", "json", "query", "rustls-no-provider"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
url = { workspace = true, features = ["std"] }
urlencoding = { workspace = true }
y7dl = { path = "../y7dl", default-features = false }

[dev-dependencies]
rustls = { workspace = true, features = ["ring", "std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
