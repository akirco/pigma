# =============================================================================
# Pigma 配置文件示例
# 配置文件路径: ~/.config/pigma/config.toml
# 未配置的字段会使用默认值
# =============================================================================

# 默认主题名称 (对应 themes 中定义的 name)
default_theme = "default"

# 快进/快退间隔 (秒)
seek_interval_secs = 15

# 搜索结果数量限制
search_limit = 100

# 导航栏位置: "left" (左侧, 默认), "right" (右侧), "top" (顶部) 或 "bottom" (底部)
navigation_position = "left"

# 歌词渐变效果: "rainbow", "fire", "ocean", "forest", "sunset", "neon", "pastel", "monochrome"
lyric_gradient = "rainbow"

# 代理地址, 支持 http:// https:// socks5://
proxy = "http://127.0.0.1:7890"

# 代理目标: "yt" (默认, 代理 YouTube), "ncm" (代理网易云), "both" (都代理)
# 海外用户: proxy_target = "ncm"  (NCM 走代理, YouTube 直连)
# 国内用户: proxy_target = "yt"   (NCM 直连, YouTube 走代理)
proxy_target = "yt"

# =============================================================================
# 缓存配置
# =============================================================================
[cache]
# 内容缓存过期时间 (秒), 0 表示不缓存
content_cache_ttl = 300
# 音质: "standard", "higher", "exhigh", "lossless", "hires", "jyeffect", "sky", "jymaster"
quality = "standard"
# 下载缓存目录 (相对于缓存目录或绝对路径)
# 默认：~/.cache/pigma/downloads
cache_dir = "downloads"
# 缓存文件命名模板, 可用变量: {id}, {name}, {singer}, {album}
cache_template = "{name}-{singer}"

# =============================================================================
# 兜底源配置 (NCM 播放失败时的多源兜底, 基于 musicx)
# =============================================================================
[source_fallback]
# 是否启用兜底源
enabled = true
# 参与兜底的源, 按优先级从高到低排列, 可选: kuwo, kugou, bilivideo, youtube
providers = ["kuwo", "kugou", "bilivideo", "youtube"]
# 单个源搜索超时(毫秒)
timeout_ms = 10000


# =============================================================================
# 边框配置
# =============================================================================
[border]
# 是否显示边框
enabled = true
# 是否使用圆角边框
rounded = false
# 边框颜色是否跟随角落颜色
follow_corner_color = false
# 边框渐变效果名称，同歌词渐变名称 (可选, 不设置则无渐变)，优先级最高
border_gradient = "rainbow"
# 边框渐变速度 (每秒变化量, 0 表示静态)
border_gradient_speed = 0.005

# =============================================================================
# 播放器栏配置
# =============================================================================
[playerbar]
# 播放栏布局: "default", "modern", "minimal"
layout = "modern"

# 进度条填充符号
filled_symbol = "━"
# 进度条未填充符号
unfilled_symbol = "─"
# 进度条填充颜色 (颜色名或 hex)
filled_color = "accent"
# 进度条未填充颜色
unfilled_color = "text"
# 已缓存到本地时进度条轨道颜色
unfilled_color_cached = "warning"
# 渐变预设: 设为空或未知名称即关闭渐变
# 可选: "warm", "cubehelix", "rainbow", "turbo", "spectral", "viridis"
gradient_preset = ""

# 播放栏各组件可见性(建议暂时别用，音量控制没写好)
[playerbar.visible]
# 是否显示封面
cover = true
# 是否显示音量控制
volume = true
# 是否显示播放模式图标
mode_icon = true
# 是否显示加载动画
spinner = true

# =============================================================================
# 标题配置 (支持 {count} 变量)
# =============================================================================
[titles]
sidebar = " NAVIGATION"
playlist = "♪ QUEUE ({count})"
lyrics = "♪ LYRICS"

# =============================================================================
# 日志配置
# =============================================================================
[logger]
# 日志级别: "error", "warn", "info", "debug", "trace"
log_level = "debug"

# =============================================================================
# 新增自定义主题
# =============================================================================
# 颜色格式: hex (#rrggbb), named (red, blue, ...), 或 indexed (0-255)
# [[themes]]
# name = "my_theme"
# bg = "#0e0e0e"           # 背景色
# surface = "#160e12"      # 表面色 (卡片、面板背景)
# text = "#ffffff"          # 主文本色
# accent = "#c20c0c"       # 强调色 (播放按钮、选中项)
# highlight = "#4ade80"     # 高亮色
# muted = "#555555"         # 次要文本色 (歌手、专辑)
# error = "#f4535a"         # 错误色
# warning = "#587fa6"       # 警告色

# =============================================================================
# 自定义列定义
# =============================================================================
# [columns]
# songs 列表页列定义
# header = 显示名称, field = 数据字段名
# width: 固定宽度 (可选)
# min_width: 最小宽度 (可选)
# ratio: 比例 (可选, 格式 [分子, 分母])
#
# [columns.songs]
# songs = [
#   { header = "TITLE", field = "name", ratio = [3, 8] },
#   { header = "ARTIST", field = "singer", ratio = [2, 8] },
#   { header = "ALBUM", field = "album", ratio = [2, 8] },
#   { header = "DURATION", field = "duration", width = 10 },
# ]
#
# [columns.songlist]
# songlist = [
#   { header = "NAME", field = "name", ratio = [3, 4] },
#   { header = "AUTHOR", field = "singer", ratio = [1, 4] },
# ]
#
# 自定义页面列覆盖
# [columns.overrides]
# toplist = [
#   { header = "RANK", field = "index", width = 6 },
#   { header = "SONG", field = "name" },
# ]
# hotsearch = [
#   { header = "#", field = "index", width = 4 },
#   { header = "KEYWORD", field = "name" },
# ]

