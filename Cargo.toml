[package]
name = "pigma"
version = "0.2.16"
edition = "2024"
description = "A netease cloud music client"
repository = "https://github.com/akirco/pigma.git"
license = "Apache-2.0"
# authors = ["akirco <earlfx@163.com>"]

[workspace]
members = ["crates/*"]
# y7dl is a git submodule with its own formatting/lockfile; making it a
# workspace member would make root `cargo fmt` rewrite the submodule and
# require a submodule commit. CI runs its tests/clippy with
# `--manifest-path crates/y7dl/Cargo.toml` instead.
exclude = ["crates/y7dl"]
# Release builds and plain `cargo build` still operate on pigma itself; CI
# runs `--workspace` explicitly to include ncm-api and sonar.
default-members = ["."]
resolver = "3"

[workspace.lints.rust]
unreachable_pub = "deny"
unused_crate_dependencies = "deny"

[workspace.lints.clippy]
redundant_clone = "deny"
clone_on_copy = "deny"
needless_borrow = "deny"
assigning_clones = "deny"

[lints]
workspace = true

[dependencies]
biquad = { version = "0.6.0", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "derive"] }
clap_complete = { version = "4.6.11", default-features = false }
crossterm = { version = "0.29.0", default-features = false, features = ["event-stream", "events", "windows"] }
dirs = { version = "7.0.0", default-features = false }
eyre = { version = "0.6.14", default-features = false, features = ["auto-install", "track-caller"] }
futures = { version = "0.3.33", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
log = { version = "0.4.34", default-features = false, features = ["serde", "std"] }
ncm-api = { path = "crates/ncm-api" }
qrcode = { version = "0.14.1", default-features = false }
rand = { version = "0.10.3", default-features = false, features = ["std", "thread_rng"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "serde"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-aac", "symphonia-flac", "symphonia-isomp4", "symphonia-mp3", "symphonia-vorbis", "symphonia-wav"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive", "rc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sonar = { path = "crates/sonar" }
stream-download = { version = "0.24.4", default-features = false, features = ["async-read", "reqwest", "temp-storage"] }
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "local-offset", "macros"] }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display", "serde"] }
unicode-width = { version = "0.2.2", default-features = false, features = ["cjk"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
opt-level = 3
# opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1
