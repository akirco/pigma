[package]
name = "pigma"
version = "0.2.2"
edition = "2024"
description = "A netease cloud music client"
repository = "https://github.com/akirco/pigma.git"
license = "Apache-2.0"
# authors = ["akirco <earlfx@163.com>"]

[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = {
  version = "0.3.33",
  default-features = false,
  features = [
    "async-await",
    "std",
  ]
}
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
log = { version = "0.4.33", features = ["serde", "std"] }
ncm-api = { path = "crates/ncm-api" }
qrcode = "0.14.1"
rand = "0.10.2"
ratatui = {
  version = "0.30.2",
  default-features = false,
  features = [
    "crossterm",
    "layout-cache",
    "macros",
    "serde",
    "underline-color",
  ]
}
ratatui-image = {
  version = "11.0.6",
  default-features = false,
  features = ["crossterm"]
}
reqwest = {
  version = "0.13.4",
  default-features = false,
  features = ["rustls-no-provider"]
}
rodio = {
  version = "0.22.2",
  default-features = false,
  features = ["flac", "mp3", "mp4", "playback", "vorbis", "wav"]
}
rustls = {
  version = "0.23.43",
  default-features = false,
  features = [
    "ring",
    "std",
  ]
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sonar = { path = "crates/sonar" }
stream-download = {
  version = "0.24.3",
  default-features = false,
  features = ["async-read", "reqwest"]
}
time = {
  version = "0.3.55",
  features = ["formatting", "local-offset", "macros"]
}
tokio = {
  version = "1.53.1",
  features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
  ]
}
toml_edit = { version = "0.25.13", features = ["serde"] }
unicode-width = "0.2.2"
url = "2.5.8"
# dhat = "0.3.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1

# [features]
# default = ["vorbis"]
# vorbis = ["rodio/vorbis"]
